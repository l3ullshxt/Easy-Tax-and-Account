# Netlify build settings (ใช้แทนค่าที่ตั้งในหน้า UI)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 ต้องใช้ Node.js 20.19 ขึ้นไป
  NODE_VERSION = "22"
  # VITE_LEAD_FORM_ENDPOINT ให้ตั้งใน Netlify: Site configuration > Environment variables

# Cache ไฟล์ที่ build แล้ว (ชื่อไฟล์มี hash เปลี่ยนทุกครั้งที่ build)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
