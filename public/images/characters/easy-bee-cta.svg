    <path d="M194 160q10-6 21-2" stroke="#553321" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M236 158q11-4 21 2" stroke="#553321" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- eyes -->
    <ellipse cx="205" cy="179" rx="5.5" ry="7" fill="#2b1d16"/>
    <ellipse cx="246" cy="179" rx="5.5" ry="7" fill="#2b1d16"/>
    <circle cx="207" cy="176" r="1.8" fill="#fff"/>
    <circle cx="248" cy="176" r="1.8" fill="#fff"/>
    <path d="M198 173l-4-3M253 173l4-3" stroke="#2b1d16" stroke-width="2" stroke-linecap="round"/>
