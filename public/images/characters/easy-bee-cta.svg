    <ellipse cx="434" cy="169" rx="5" ry="6.5" fill="#2b1d16"/>
    <circle cx="400" cy="166.5" r="1.7" fill="#fff"/>
    <circle cx="436" cy="166.5" r="1.7" fill="#fff"/>
