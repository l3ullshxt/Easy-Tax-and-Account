    <path d="M225 188q4 7-2 9" stroke="#d9a386" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M210 207q15 16 30 0q-15 6-30 0z" fill="#c65a4c"/>
    <ellipse cx="190" cy="200" rx="9" ry="5" fill="#f2a39a" opacity=".45"/>
    <ellipse cx="260" cy="200" rx="9" ry="5" fill="#f2a39a" opacity=".45"/>
  </g>

