  <path d="M456 390h46v34a10 10 0 0 1-10 10h-26a10 10 0 0 1-10-10z" fill="#fff"/>
  <text x="479" y="418" text-anchor="middle" font-family="'Brush Script MT','Segoe Script','Caveat',cursive" font-size="16" font-weight="700" fill="#1f7a47">Easy</text>

