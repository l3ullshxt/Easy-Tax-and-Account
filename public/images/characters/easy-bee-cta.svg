<svg xmlns="http://www.w3.org/2000/svg" viewBox="126 78 466 362" role="img" aria-labelledby="title desc">
  <title id="title">พี่ Easy และน้อง Bee (CTA)</title>
  <desc id="desc">Illustration placeholder: พี่ Easy (ผู้หญิงผมยาวสีน้ำตาล สวมเบลเซอร์สีเขียว) และน้อง Bee (ผู้ชายผมสีน้ำตาล สวมฮู้ดดี้สีเขียว) นั่งทำบัญชีด้วยกันที่โต๊ะทำงาน — เปลี่ยนเป็นภาพจริงได้ภายหลัง</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1e5"/>
      <stop offset="1" stop-color="#f3faf5"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e6d0"/>
      <stop offset="1" stop-color="#e2d2b3"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25824e"/>
      <stop offset="1" stop-color="#196a3d"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d9559"/>
      <stop offset="1" stop-color="#207a47"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f4f5"/>
      <stop offset="1" stop-color="#d3dadd"/>
    </linearGradient>
    <linearGradient id="hairW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e452b"/>
      <stop offset="1" stop-color="#553321"/>
    </linearGradient>
  </defs>

  <!-- ===== พี่ Easy ===== -->
  <g>
    <path d="M160 190C150 120 185 94 227 94c45 0 75 28 67 96 6 60 10 110 6 148H152c-4-38 0-88 8-148z" fill="url(#hairW)"/>
    <path d="M136 440c-4-80 4-140 36-164 13-10 28-16 40-18h26c12 2 27 8 40 18 32 24 40 84 36 164z" fill="url(#blazer)"/>
    <path d="M208 222h34v44c-6 8-28 8-34 0z" fill="#ecbd9d"/>
    <path d="M202 258l23 64 23-64z" fill="#fff"/>
    <path d="M198 258l27 70-15 20-30-74z" fill="#16613a"/>
    <path d="M252 258l-27 70 15 20 30-74z" fill="#16613a"/>
    <circle cx="258" cy="356" r="3" fill="#0f4a2b"/>
    <circle cx="258" cy="380" r="3" fill="#0f4a2b"/>
    <!-- name badge -->
    <rect x="166" y="316" width="30" height="18" rx="4" fill="#fff" opacity=".95"/>
    <rect x="171" y="322" width="20" height="3" rx="1.5" fill="#f5c93a"/>
    <rect x="171" y="328" width="14" height="2.5" rx="1.25" fill="#93cda9"/>
