  <rect x="252" y="316" width="164" height="112" rx="11" fill="none" stroke="#c3ccd1" stroke-width="2"/>
  <text x="334" y="376" text-anchor="middle" font-family="'Brush Script MT','Segoe Script','Caveat',cursive" font-size="32" font-weight="700" fill="#1f7a47">Easy</text>
  <path d="M362 348l6-10M368 352l9-5" stroke="#f5c93a" stroke-width="2.5" stroke-linecap="round"/>
