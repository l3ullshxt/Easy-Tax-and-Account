    <path d="M415 180q4 6-1 9" stroke="#d49c7c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M396 196q19 26 40 0z" fill="#a8423a"/>
    <path d="M399 197.5q16 7 34 0l-1 4q-16 8-32 0z" fill="#fff"/>
    <ellipse cx="383" cy="192" rx="8" ry="4.5" fill="#f2a39a" opacity=".45"/>
    <ellipse cx="449" cy="192" rx="8" ry="4.5" fill="#f2a39a" opacity=".45"/>
    </g>
    <!-- thumbs up arm -->
    <path d="M488 292l40 74 18-72" fill="none" stroke="#17633a" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M488 292l40 74 18-72" fill="none" stroke="url(#hoodie)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="524" y="244" width="46" height="42" rx="15" fill="#f5ceb0"/>
    <rect x="530" y="206" width="18" height="50" rx="9" fill="#f5ceb0"/>
    <path d="M552 256h15M552 266h15M552 276h13" stroke="#e0a987" stroke-width="2" stroke-linecap="round"/>
    <rect x="524" y="282" width="46" height="16" rx="7" fill="#196b3e"/>
  </g>

  <!-- พี่ Easy arm resting -->
  <path d="M168 306c-16 32-18 76-6 102 8 16 24 20 44 18" fill="none" stroke="#15603a" stroke-width="34" stroke-linecap="round"/>
  <path d="M168 306c-16 32-18 76-6 102 8 16 24 20 44 18" fill="none" stroke="url(#blazer)" stroke-width="29" stroke-linecap="round"/>
  <ellipse cx="214" cy="425" rx="16" ry="10.5" fill="#f7d6bf"/>
  <path d="M203 416q-4 9 0 18" stroke="#f3f7f4" stroke-width="4" stroke-linecap="round" fill="none"/>

