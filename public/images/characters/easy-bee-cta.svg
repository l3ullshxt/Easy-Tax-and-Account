    <path d="M272 150c22 50 12 112 30 186-20 4-42-36-42-104 0-32 4-60 12-82z" fill="#6a4229"/>
    <!-- ears -->
    <ellipse cx="174" cy="185" rx="9" ry="13" fill="#f1c7aa"/>
    <ellipse cx="276" cy="185" rx="9" ry="13" fill="#f1c7aa"/>
    <circle cx="174" cy="203" r="3.5" fill="#f5c93a"/>
    <circle cx="276" cy="203" r="3.5" fill="#f5c93a"/>
    <!-- face -->
    <path d="M173 170c0-42 23-54 52-54s52 12 52 54c0 42-21 68-52 68s-52-26-52-68z" fill="#f7d6bf"/>
